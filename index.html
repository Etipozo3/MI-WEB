<!DOCTYPE html>
<html lang="es">
	<head>
		<title>MI-WEB</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

        <div id="overlay">
			<button id="startButton">Play</button>
			<div id="carga"></div>
		</div>

        <div id="container"></div>

        <audio loop id="music" preload="auto" style="display: none">
			<source src="sounds/universo.mp3" type="audio/mpeg">
		</audio>

        <video id="video1" loop muted crossOrigin="anonymous" playsinline style="display:none">
			<source src="videos/galax.mp4">
			
		</video>

		<video id="video" crossOrigin="anonymous" playsinline style="display:none">
			<source src="videos/prueba.mp4">
		</video>
		
		<script id="vs" type="x-shader/x-vertex">

			uniform sampler2D map;

			uniform float width;
			uniform float height;
			uniform float nearClipping, farClipping;

			uniform float pointSize;
			uniform float zOffset;

			varying vec2 vUv;

			const float XtoZ = 1.11146; // tan( 1.0144686 / 2.0 ) * 2.0;
			const float YtoZ = 0.83359; // tan( 0.7898090 / 2.0 ) * 2.0;

			void main() {

				vUv = vec2( position.x / width, position.y / height );

				vec4 color = texture2D( map, vUv );
				float depth = ( color.r + color.g + color.b ) / 3.0;

				// Projection code by @kcmic

				float z = ( 1.0 - depth ) * (farClipping - nearClipping) + nearClipping;

				vec4 pos = vec4(
					( position.x / width - 0.5 ) * z * XtoZ,
					( position.y / height - 0.5 ) * z * YtoZ,
					- z + zOffset,
					1.0);

				gl_PointSize = pointSize;
				gl_Position = projectionMatrix * modelViewMatrix * pos;

			}

		</script>

		<script id="fs" type="x-shader/x-fragment">

			uniform sampler2D map;

			varying vec2 vUv;

			void main() {

				vec4 color = texture2D( map, vUv );
				gl_FragColor = vec4( color.r, color.g, color.b, 0.2 );

			}

		</script>

		<script type="importmap">
			{
				"imports": {
					"three": "./build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';
            import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
			import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
			import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
			import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
			import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
			import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

			let scene, camera, renderer, controls, composer, clock;
			let geometryo, mesh1, mesh2, material0;
			let INTERSECTED;
            let esferas;
			let mixer1;

			const params = {
				threshold: 0,
				strength: 0.12,
				radius: 0,
				exposure: 1
			};

            const screenPointer = new THREE.Vector2();
			const scenePointer = new THREE.Vector3();
			const raycastPlane = new THREE.Plane( new THREE.Vector3( 0, 0, 1 ), 0 );
			const raycaster = new THREE.Raycaster();

			const startButton = document.getElementById( 'startButton' );
			startButton.addEventListener( 'click', init );

			function init() {

                const overlay = document.getElementById( 'overlay' );
				overlay.remove();

				const container = document.getElementById( 'container' );

				camera = new THREE.PerspectiveCamera( 100, window.innerWidth / window.innerHeight, 0.1, 1000 );
				camera.position.set( 0, 1, 12 );

                scene = new THREE.Scene();

                clock = new THREE.Clock();

                const video1 = document.getElementById( 'video1' );
				video1.play();
				const universo = new THREE.SphereGeometry( 4, 64, 32 );
				universo.scale( - 9, 9, 9 );
				const textureu = new THREE.VideoTexture( video1 );
				const materialu = new THREE.MeshLambertMaterial( { map: textureu } );
				const meshu = new THREE.Mesh( universo, materialu );
				meshu.position.set(0, 0, 1 );
				meshu.rotation.set(0, Math.PI/-2, 0 );
				scene.add( meshu );

				const video = document.getElementById( 'video' );
				video.play();
				const textureyo = new THREE.VideoTexture( video );
				textureyo.minFilter = THREE.NearestFilter;
				textureyo.generateMipmaps = false;
				const width = 640, height = 480;
				const nearClipping = 3500, farClipping = 3500;

				geometryo = new THREE.BufferGeometry();

				const vertices = new Float32Array( width * height * 3 );

				for ( let i = 0, j = 0, l = vertices.length; i < l; i += 3, j ++ ) {

					vertices[ i ] = j % width;
					vertices[ i + 1 ] = Math.floor( j / width );

				}

				geometryo.setAttribute( 'position', new THREE.BufferAttribute( vertices, 3 ) );

				material0 = new THREE.ShaderMaterial( {

					uniforms: {

						'map': { value: textureyo },
						'width': { value: width },
						'height': { value: height },
						'nearClipping': { value: nearClipping },
						'farClipping': { value: farClipping },

						'pointSize': { value: 1.5 },
						'zOffset': { value: 1000 }

					},
					vertexShader: document.getElementById( 'vs' ).textContent,
					fragmentShader: document.getElementById( 'fs' ).textContent,
					blending: THREE.AdditiveBlending,
					depthTest: false, depthWrite: false,
					transparent: true

				} );

				mesh1 = new THREE.Points( geometryo, material0 );
				mesh1.position.set( 0, -0.2, 5);
                mesh1.scale.set( 0.002, 0.003, 0.002 );
				scene.add( mesh1 );

				const esfera = new THREE.SphereGeometry( 0.8, 32, 16 );
				const textureLoader1 = new THREE.TextureLoader();

				const youtube = new THREE.TextureLoader().load( './images/youtube.png' );
				youtube.colorSpace = THREE.SRGBColorSpace;
				youtube.wrapS = THREE.RepeatWrapping;
				youtube.wrapT = THREE.RepeatWrapping;
				youtube.repeat.x = 2;
				youtube.repeat.y = 1;
				const material1 = new THREE.MeshPhongMaterial( { map: youtube } );
                
				const inst = new THREE.TextureLoader().load( './images/instagram.png' );
                inst.colorSpace = THREE.SRGBColorSpace;
				inst.wrapS = THREE.RepeatWrapping;
				inst.wrapT = THREE.RepeatWrapping;
				inst.repeat.x = 2;
				inst.repeat.y = 1;
				const material2 = new THREE.MeshPhongMaterial( { map: inst } );

				const tiktok = new THREE.TextureLoader().load( './images/tiktok.png' );
				tiktok.colorSpace = THREE.SRGBColorSpace;
				tiktok.wrapS = THREE.RepeatWrapping;
				tiktok.wrapT = THREE.RepeatWrapping;
				tiktok.repeat.x = 2;
				tiktok.repeat.y = 1;
				const material3 = new THREE.MeshPhongMaterial( { map: tiktok } );

				const conf = new THREE.TextureLoader().load( './images/configuracion.png' );
				conf.colorSpace = THREE.SRGBColorSpace;
				conf.wrapS = THREE.RepeatWrapping;
				conf.wrapT = THREE.RepeatWrapping;
				conf.repeat.x = 2;
				conf.repeat.y = 1;
				const material4 = new THREE.MeshPhongMaterial( { map: conf } );

				const wasap = new THREE.TextureLoader().load( './images/wasap.png' );
				wasap.colorSpace = THREE.SRGBColorSpace;
				wasap.wrapS = THREE.RepeatWrapping;
				wasap.wrapT = THREE.RepeatWrapping;
				wasap.repeat.x = 2;
				wasap.repeat.y = 1;
				const material5 = new THREE.MeshPhongMaterial( { map: wasap } );

				const ubi = new THREE.TextureLoader().load( './images/ubicacion.png' );
				ubi.colorSpace = THREE.SRGBColorSpace;
				ubi.wrapS = THREE.RepeatWrapping;
				ubi.wrapT = THREE.RepeatWrapping;
				ubi.repeat.x = 2;
				ubi.repeat.y = 1;
				const material6 = new THREE.MeshPhongMaterial( { map: ubi } );

				const face = new THREE.TextureLoader().load( './images/facebook.png' );
				face.colorSpace = THREE.SRGBColorSpace;
				face.wrapS = THREE.RepeatWrapping;
				face.wrapT = THREE.RepeatWrapping;
				face.repeat.x = 2;
				face.repeat.y = 1;
				const material7 = new THREE.MeshPhongMaterial( { map: face } );

				const inicio = new THREE.TextureLoader().load( './images/inicio.png' );
                inicio.colorSpace = THREE.SRGBColorSpace;
				inicio.wrapS = THREE.RepeatWrapping;
				inicio.wrapT = THREE.RepeatWrapping;
				inicio.repeat.x = 2;
				inicio.repeat.y = 1;
				const material8 = new THREE.MeshPhongMaterial( { map: inicio } );

				function createMesh(geometry, material, x, y, z, name, x1, y1, z1) {
				mesh2 = new THREE.Mesh(geometry, material.clone());
				mesh2.position.set(x, y, z);
				mesh2.name = name;
				mesh2.rotation.set(x1, y1, z1);
				
				return mesh2;
				}

				esferas = new THREE.Group();
				// youtube
				esferas.add(createMesh(esfera, material1, 2, -4.8, 0,'Esfera1', 0, 0, 0));
                // instagram
				esferas.add(createMesh(esfera, material2, -2, -4.8, 0,'Esfera2', 0, 0, 0));
				// tiktok
				esferas.add(createMesh(esfera, material3, 2, 4.8, 0,'Esfera3', 0, 0, 0));
                // configuracion
				esferas.add(createMesh(esfera, material4, -2, 4.8, 0,'Esfera4', 0, 0, 0));
				// wasap
				esferas.add(createMesh(esfera, material5, -4.8, 2, 0,'Esfera5', 0, 0, 0));
                // ubicacion
				esferas.add(createMesh(esfera, material6, 4.8, 2, 0,'Esfera6', 0, 0, 0));
                // facebook
				esferas.add(createMesh(esfera, material7, -4.8, -2, 0,'Esfera7', 0, 0, 0));
                // inicio
				esferas.add(createMesh(esfera, material8, 4.8, -2, 0,'Esfera8', 0, 0, 0));

				scene.add(esferas);

				const rgbeLoader = new RGBELoader();

				rgbeLoader.load('./textures/royal_esplanade_1k.hdr', function(texture) {
					texture.mapping = THREE.EquirectangularReflectionMapping;
					scene.environment = texture;

					const loader1 = new GLTFLoader().setPath( './3/' );
					loader1.setDRACOLoader( new DRACOLoader().setDecoderPath( './jsm/libs/draco/gltf/' ) );
					loader1.load( 'parti3.glb', function ( gltf ) {

						const model = gltf.scene;

						model.position.set(0, 0, 0);
						model.scale.set(0.088, 0.088, 0.088);
						scene.add( model );

						mixer1 = new THREE.AnimationMixer( model );
						mixer1.clipAction( gltf.animations[ 0 ] ).play();
				
						renderer.setAnimationLoop( animate );

					} );

				} );
				
				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				
				container.appendChild( renderer.domElement );

                const ambientLight = new THREE.AmbientLight(0xffffff, 1);
				ambientLight.receiveShadow = true;
				scene.add(ambientLight);

				const renderScene = new RenderPass( scene, camera );

				const bloomPass = new UnrealBloomPass( new THREE.Vector2( window.innerWidth, window.innerHeight ), 1.5, 0.4, 0.85 );
				bloomPass.threshold = params.threshold;
				bloomPass.strength = params.strength;
				bloomPass.radius = params.radius;

				const outputPass = new OutputPass();

				composer = new EffectComposer( renderer );
				composer.addPass( renderScene );
				composer.addPass( bloomPass );
				composer.addPass( outputPass );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
				controls.enablePan = false;
				controls.maxPolarAngle = Math.PI * 0.5;
				controls.target.set( 0, 2, 0 );
				controls.minDistance = 7;
				controls.maxDistance = 28;
				controls.saveState()

				window.addEventListener( 'resize', onWindowResize );
                window.addEventListener( 'pointermove', onPointerMove );
				window.addEventListener('mousedown', onMouseDown);

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function onPointerMove( e ) {

				screenPointer.x = ( e.clientX / window.innerWidth ) * 2 - 1;
				screenPointer.y = - ( e.clientY / window.innerHeight ) * 2 + 1;
				
			}

			function updatePointer() {

				raycaster.setFromCamera( screenPointer, camera );
				raycaster.ray.intersectPlane( raycastPlane, scenePointer );

				const intersects = raycaster.intersectObjects( esferas.children, false );

				if ( intersects.length > 0 ) {

					if ( INTERSECTED != intersects[ 0 ].object) {

						if ( INTERSECTED ) INTERSECTED.material.emissive.setHex( INTERSECTED.currentHex );

						INTERSECTED = intersects[ 0 ].object;
						INTERSECTED.currentHex = INTERSECTED.material.emissive.getHex();
						INTERSECTED.material.emissive.set( 0xfaed27 );

					}

				} else {

					if ( INTERSECTED ) INTERSECTED.material.emissive.setHex( INTERSECTED.currentHex );

					INTERSECTED = null;

				}

			}

			function onMouseDown(event) {
				
				const coords = new THREE.Vector2(
					
					(event.clientX / renderer.domElement.clientWidth) * 2 - 1,
					-((event.clientY / renderer.domElement.clientHeight) * 2 - 1),
				);

				raycaster.setFromCamera(coords, camera);

				const intersections = raycaster.intersectObjects( scene.children, true);

				if ( intersections[0].object.name == 'Esfera1') {
					//  Redirigir a youtube
					window.open("https://www.youtube.com/@MI-WEB/videos") ;
					controls.reset()
				}
				if ( intersections[0].object.name == 'Esfera2') {
					//  Redirigir a instagram
					window.open("https://www.instagram.com/") ;
					controls.reset()
				}
				if ( intersections[0].object.name == 'Esfera3') {
					//  Redirigir a tiktok
					window.open("https://www.tiktok.com/@etipozo?_t=ZN-8ydDXrHgeEp&_r=1") ;
					controls.reset()
				}
				if ( intersections[0].object.name == 'Esfera4') {
					//  Redirigir a configuracion
					window.open("https://www.tiktok.com/@etipozo?_t=ZN-8ydDXrHgeEp&_r=1") ;
					controls.reset()
				}
				if ( intersections[0].object.name == 'Esfera5') {
					//  Redirigir a wasap
					window.open("https://wa.me/34643084215") ;
					controls.reset()
				}
				if ( intersections[0].object.name == 'Esfera6') {
					//  Redirigir a googlemap
					window.open("https://www.google.com/maps/place/C.+del+Cabo+de+Tarifa,+94,+Puente+de+Vallecas,+28053+Madrid/@40.3707987,-3.6627152,726m/data=!3m1!1e3!4m6!3m5!1s0xd42242a5b22d267:0x77a6e4b054dc4a9d!8m2!3d40.3703964!4d-3.6606136!16s%2Fg%2F11c2ddk4yp?entry=ttu&g_ep=EgoyMDI1MDcyMC4wIKXMDSoASAFQAw%3D%3D") ;
					controls.reset()
				}
				if ( intersections[0].object.name == 'Esfera7') {
					//  Redirigir a facebook
					window.open("https://www.facebook.com/login.php") ;
					controls.reset()
				}
				if ( intersections[0].object.name == 'Esfera8') {
					//  Redirigir a inicio
					window.open("https://www.google.com/imgres?q=inicio&imgurl=https%3A%2F%2Fdeconceptos.com%2Fwp-content%2Fuploads%2F2014%2F07%2Fconcepto-de-inicio.jpg&imgrefurl=https%3A%2F%2Fdeconceptos.com%2Fgeneral%2Finicio&docid=OethzoIXUbaKhM&tbnid=RI1L8or9p74jPM&vet=12ahUKEwjpgOLf9NiOAxWNKvsDHStoKh0QM3oECBgQAA..i&w=267&h=189&hcb=2&ved=2ahUKEwjpgOLf9NiOAxWNKvsDHStoKh0QM3oECBgQAA") ;
					controls.reset()
				}
			}

			function animate() {

                const dt = clock.getDelta();
				if ( mixer1 ) mixer1.update( dt / 10 );

				raycastPlane.normal.applyEuler( camera.rotation );
				updatePointer();

                controls.update();
				composer.render();

			}

		</script>
	</body>


</html>
